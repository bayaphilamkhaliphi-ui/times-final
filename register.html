<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Registration - Times of Eswatini HR Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* (same styles as original) */
        *{ margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
        body{ background:linear-gradient(135deg,#8B0000,#D40000); height:100vh; display:flex; justify-content:center; align-items:center; }
        .container{ width:100%; max-width:1000px; background:white; border-radius:20px; overflow:hidden; display:grid; grid-template-columns:1.1fr 0.9fr; box-shadow:0 20px 50px rgba(0,0,0,.25); }
        .left{ background:#8B0000; color:white; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:60px; text-align:center; }
        .left h1{ font-size:40px; margin-bottom:15px; }
        .left h3{ font-weight:400; }
        .right{ padding:50px; }
        .logo{ text-align:center; margin-bottom:30px; }
        .logo h2{ color:#8B0000; font-size:30px; }
        .logo p{ color:#666; }
        .form-group{ margin-bottom:18px; }
        label{ display:block; margin-bottom:8px; color:#444; font-size:14px; font-weight:500; }
        input{ width:100%; padding:14px; border:1px solid #ccc; border-radius:8px; font-size:15px; outline:none; }
        input:focus{ border-color:#8B0000; }
        button{ width:100%; padding:15px; border:none; border-radius:8px; background:#8B0000; color:white; font-size:16px; cursor:pointer; }
        button:hover{ background:#600000; }
        .login{ margin-top:20px; text-align:center; }
        .login a{ color:#8B0000; text-decoration:none; font-weight:600; }
        .login a:hover{ text-decoration:underline; }
        .footer{ margin-top:30px; text-align:center; color:#777; font-size:12px; }
        @media(max-width:850px){ .container{ grid-template-columns:1fr; } .left{ display:none; } .right{ padding:40px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="left">
            <h1>Times of Eswatini</h1>
            <h3>Human Resource Management Portal</h3>
            <p style="margin-top:20px;">Create your employee profile and access HR services.</p>
        </div>
        <div class="right">
            <div class="logo">
                <h2>Staff Registration</h2>
                <p>Create your HR Portal account</p>
            </div>

            <form action="reg.php" method="POST">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="fullname" placeholder="Enter full name" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="Enter email address" required>
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="Create username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Create password (min 8 chars)" required>
                </div>
                <button type="submit" name="register">Register Account</button>
            </form>

            <div class="login">
                <p>Already have an account?</p>
                <a href="index.html">Back to Login</a>
            </div>
            <div class="footer">© 2026 Times of Eswatini HR Management System</div>
        </div>
    </div>
</body>
</html>
